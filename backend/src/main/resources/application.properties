spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/chatflow_db}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/chatflow_db}
server.port=${PORT:8080}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
frontend.url=${FRONTEND_URL:http://localhost:5173}

# Optional SMTP Mail Configuration (e.g. Gmail / SendGrid / Brevo / Render env vars)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
